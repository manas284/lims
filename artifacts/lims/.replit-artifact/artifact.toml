kind = "web"
previewPath = "/"
title = "LIMS - Laboratory Information Management System"
version = "1.0.0"
id = "artifacts/lims"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25792
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/lims run dev"

[services.env]
PORT = "25792"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/lims", "run", "build"]
publicDir = "artifacts/lims/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
